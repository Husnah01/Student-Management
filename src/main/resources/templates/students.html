<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registered Students</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="container">

    <h1>Registered Students</h1>

    <p class="success"
       th:if="${successMessage}"
       th:text="${successMessage}">
    </p>

    <p class="error"
       th:if="${notFoundMessage}"
       th:text="${notFoundMessage}">
    </p>

    <a th:href="@{/student/register}">
        Register New Student
    </a>

    <a th:href="@{/student/all}">
        View All Students
    </a>

    <div th:if="${#lists.isEmpty(students)}"
         th:unless="${notFoundMessage}">
        <p>No students have been registered yet.</p>
    </div>

    <table th:if="${not #lists.isEmpty(students)}">

        <thead>
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Age</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="student : ${students}">

            <td th:text="${student.id}"></td>
            <td th:text="${student.firstName}"></td>
            <td th:text="${student.lastName}"></td>
            <td th:text="${student.email}"></td>
            <td th:text="${student.age}"></td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
